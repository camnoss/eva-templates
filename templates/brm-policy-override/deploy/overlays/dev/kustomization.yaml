apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The namespace (${{ values.name }}-dev) is set by the apps ApplicationSet.
resources:
  - ../../base
# The name gets a content hash, so editing pin.conf restarts the CM.
configMapGenerator:
  - name: ${{ values.name }}-pin-conf
    files:
      - pin.conf=pin.conf.overrides
images:
  - name: app
    newName: ghcr.io/camnoss/${{ values.name }}
    newTag: ${{ values.imageTag | dump }}
