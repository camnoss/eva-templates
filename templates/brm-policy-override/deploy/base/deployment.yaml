apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ values.name }}
  labels:
    app.kubernetes.io/name: ${{ values.name }}
    app.kubernetes.io/component: brm-cm
    backstage.io/kubernetes-id: ${{ values.name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ${{ values.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ${{ values.name }}
        app.kubernetes.io/component: brm-cm
        backstage.io/kubernetes-id: ${{ values.name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cm
          image: app
          ports:
            - name: pcm
              containerPort: 11960
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          # The CM has no HTTP endpoint; it is up when it accepts PCM connections.
          startupProbe:
            tcpSocket:
              port: pcm
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: pcm
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: pcm
            periodSeconds: 5
          volumeMounts:
            # pin.conf and cm.pinlog, written by the entrypoint.
            - name: workdir
              mountPath: /var/run/cm
            - name: pin-conf
              mountPath: /etc/nerv/cm/overrides
              readOnly: true
            - name: wallet
              mountPath: /oms/wallet/client
              readOnly: true
      volumes:
        - name: workdir
          emptyDir: {}
        - name: pin-conf
          configMap:
            name: ${{ values.name }}-pin-conf
        # CM credentials for the DM. The platform provides this Secret in every
        # BRM namespace; the pod waits for it.
        - name: wallet
          secret:
            secretName: brm-cm-credentials
