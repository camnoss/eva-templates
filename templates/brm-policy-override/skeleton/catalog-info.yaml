apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.name }}
  description: ${{ values.description | dump }}
  annotations:
    github.com/project-slug: camnoss/${{ values.name }}
    backstage.io/kubernetes-id: ${{ values.name }}
    argocd/app-name: ${{ values.name }}-dev
    # Every stock policy opcode this CM customizes, comma-separated. Keep it in
    # sync with overrides.conf.
    nerv.io/brm-policy-opcodes: ${{ values.policyOpcode }}
  tags:
    - brm
    - c
    - policy
spec:
  type: service
  lifecycle: experimental
  owner: ${{ values.owner }}
