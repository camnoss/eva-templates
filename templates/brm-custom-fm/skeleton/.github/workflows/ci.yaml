name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Needs no BRM: formatting and static analysis only read our sources.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq clang-format cppcheck
      - run: make lint

  # Compiling and unit testing need the Oracle BRM 15 SDK, which Nerv does not
  # provide. Set the BRM_SDK_IMAGE repository variable to an SDK image you are
  # licensed to use and this job runs; without it, the job is skipped.
  build:
    needs: lint
    if: vars.BRM_SDK_IMAGE != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: test
          build-args: BRM_SDK_IMAGE=${{ vars.BRM_SDK_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
